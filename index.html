    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in iframe / proxy environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message) : '';
        var file = (event && event.filename) ? String(event.filename) : '';
        if (
          file.includes('@vite/client') ||
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('ws://') ||
          msg.includes('wss://')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason) ? (event.reason.message || String(event.reason)) : '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          reason.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
